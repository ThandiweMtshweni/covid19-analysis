<!DOCTYPE html>
<html>
  <head>
    <title>Covid 19 Stats</title>
    <link rel="stylesheet" href="style.css">
</head>
  <body>

    <div class="container">
      <h2 class="h2-heading">
        COVID-19 Early Outbreak Analysis
      </h2>
      <img class="covid-img" src="images.jpeg">
      <p class="choice-paragraph">Please choose a country:</p>
      <label class="country_label" for="country_selection">
        Country:
      </label>
      <select class="options" id="country-selection" name="country_selection">
          <option value="China">China</option>
          <option value="Italy">Italy</option>
          <option value="South Korea">South Korea</option>
          <option value="United States">United States</option>
          <option value="South Africa">South Africa</option>
        </select>

        <button class="confirmed-button">
          Confirmed
        </button>
        <button class="deaths-button">
            Deaths
        </button>
        <button class="recoveries-button">
          Recoveries
        </button>
    </div>
  </body>

</html>
